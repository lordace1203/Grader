<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PAGE TITLE -->
    <title>Grader</title>
    <!-- STYLE SHEET -->
    <link rel="stylesheet" href="style.css">
    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- GLOBAL FONT LINKS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chango&family=Molle&family=Playpen+Sans+Hebrew:wght@100..800&family=Poetsen+One&family=Potta+One&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <header id="heading">
            <h1>Grader <i class="fa-solid fa-calculator"></i></h1>
        </header>
        <div class="point-system">
            <input type="radio" name="grading" id="first-point-system" value="4" checked>
            <label for="4-point">4 Point System</label>
            <input type="radio" name="grading" value="5" id="second-point-system">
            <label for="5-point">5 Point System</label>
        </div>
        <div class="course-container">
            <div class="headings">
                <p>TITLE</p>
                <p>UNIT</p>
                <p>GRADE</p>
            </div>
            <div class="course">
                <p class="serial-number"></p>
                <input type="text" placeholder="Title" class="course-title">
                <input type="number" value="1" placeholder="Unit" class="course-unit">
                <input type="text" placeholder="Grade" class="course-grade">
                <i class="fa-solid fa-trash delete"></i>
            </div>
        </div>
        <button id="addCourseBtn">Add Course</i></button>
        <button id="calculateBtn">Calculate <i class="fa-solid fa-paper-plane"></i></button>
        <div class="gpa">GPA: 0.00</div>
    </div>

    <footer>
        <p class="copyrightText">&copy; 2025 Your Company Name. All rights reserved.
</p>
    </footer>
    <!-- JAVASCRIPT TAG -->
    <script src="./index.js"></script>
</body>

</html>
